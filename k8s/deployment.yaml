apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp270-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: mp270-api

  template:
    metadata:
      labels:
        app: mp270-api

    spec:
      containers:
        - name: mp270-api
          image: mp270-api:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20